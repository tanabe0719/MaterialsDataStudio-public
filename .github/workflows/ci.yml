name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (${{ matrix.python }})
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      UV_PYTHON: ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.15'
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --frozen --extra dev
      - run: uv run python -m scripts.publication_check --secrets
      - run: uv run pytest --cov=materials_data_studio --cov-report=term-missing --cov-fail-under=80 --maxfail=1 -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run pyright --project pyright-tests.json
      - run: uv run python scripts/build_manual.py
      - run: uv run python scripts/check_visual_performance.py
