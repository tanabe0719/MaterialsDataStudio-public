name: Windows installer release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mds-installer-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      UV_PYTHON: '3.12'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.8.15'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Require a new, exact version tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -notmatch '^refs/tags/v[0-9]+[.][0-9]+[.][0-9]+$') { throw 'Dispatch on the exact version tag.' }
          $Version = (Get-Content packaging/publication.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$Version") { throw 'Version tag mismatch.' }
      - run: uv sync --frozen --extra dev
      - run: uv run python -m scripts.validate_publication
      - run: uv run python -m scripts.publication_check --secrets
      - run: powershell -ExecutionPolicy Bypass -File packaging/build_windows.ps1 -Package -SkipValidation
      - run: uv run python scripts/prepare_corresponding_sources.py --bundle
      - name: Restore reviewed reference assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python scripts/restore_reference_assets.py
          if ($LASTEXITCODE -ne 0) { throw 'Reference assets are not ready; release remains unpublished.' }
      - name: Verify and publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python scripts/publish_release.py publish
